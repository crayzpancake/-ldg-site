<head>
<meta charset="utf-8">

<style>
:root{--bg:#f7f5f1;--card:#fff;--ink:#1f1f1f;--mute:#8a8580;--line:#e6e1d9;--red:#d00;--soft:#fbeeee;--chip:#efebe5}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.7 -apple-system,"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:16px 14px 64px}
header h1{font-size:21px;margin:2px 0 0}
header .sub{color:var(--mute);font-size:13px}
b,.k{color:var(--red);font-weight:700}
nav.tabs{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0 4px;margin:6px 0 4px}
nav.tabs .row{display:flex;gap:6px;overflow-x:auto;padding:3px 0;scrollbar-width:none}
nav.tabs .row::-webkit-scrollbar{display:none}
nav.tabs button.mo{border-radius:8px;font-weight:600}
nav.tabs button.mo.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.auto{display:inline-block;font-size:11px;color:var(--mute);border:1px solid var(--line);border-radius:6px;padding:0 6px;margin-left:6px;font-weight:400}
nav.tabs button{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:6px 12px;border-radius:18px;font-size:14px;cursor:pointer;white-space:nowrap}

.box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:12px 0}
.box h2{font-size:16px;margin:0 0 8px;display:flex;justify-content:space-between;align-items:baseline}
.box h2 small{font-weight:400;color:var(--mute);font-size:12px}
ol.hl{margin:0;padding-left:20px}ol.hl li{margin:6px 0}
details.grp{background:var(--card);border:1px solid var(--line);border-radius:12px;margin:10px 0;overflow:hidden}
details.grp>summary{list-style:none;cursor:pointer;padding:11px 16px;font-weight:700;display:flex;justify-content:space-between;align-items:center}
details.grp>summary::-webkit-details-marker{display:none}
details.grp>summary::after{content:"展开";font-size:12px;color:var(--mute);font-weight:400}
details.grp[open]>summary::after{content:"收起"}
details.grp>summary .n{font-weight:400;color:var(--mute);font-size:13px;margin-left:6px}
details.grp.inv>summary{border-left:4px solid var(--red)}
.post{border-top:1px solid var(--line);padding:10px 16px}
.meta{font-size:12px;color:var(--mute);display:flex;justify-content:space-between}
.meta a{color:var(--mute)}
.q{font-size:14px;color:var(--mute);margin-top:4px;white-space:pre-wrap}
.q::before{content:"问 ";color:var(--mute);font-weight:700}
.x{white-space:pre-wrap;margin-top:2px}
.post.reply .x::before{content:"答 ";color:var(--red);font-weight:700}
.src{white-space:pre-wrap;margin-top:6px;padding:7px 10px;background:var(--bg);border-radius:8px;font-size:14px;color:var(--mute)}
.src em{font-style:normal;color:var(--ink);font-weight:600}
.note{font-size:13px;color:var(--mute);margin-top:4px;padding-left:8px;border-left:2px solid var(--line)}
table{width:100%;border-collapse:collapse;font-size:14px}
td{border-top:1px solid var(--line);padding:7px 4px;vertical-align:top}
td.a{white-space:nowrap;font-weight:700;width:4.5em}
td.d{white-space:nowrap;color:var(--mute);width:3.6em}
td a{color:var(--mute);font-size:12px;margin-left:4px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.chips button{border:0;background:var(--chip);color:var(--ink);padding:3px 10px;border-radius:12px;font-size:13px;cursor:pointer}
.chips button.on{background:var(--red);color:#fff}
.empty{color:var(--mute);text-align:center;padding:40px 0}
.daybar{display:flex;gap:8px;align-items:center;margin:4px 0 2px}
.daybar select{flex:1;font-size:15px;padding:7px 8px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.daybar button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:7px 12px;font-size:15px;cursor:pointer}
.daybar button:disabled{opacity:.35}
.auto{font-size:12px;color:var(--mute);background:var(--chip);border-radius:8px;padding:6px 10px;margin-top:10px}
.wk h2{font-size:16px}
.foot{color:var(--mute);font-size:12px;margin-top:18px}

.tile{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.tile-v{font-size:26px;font-weight:700;line-height:1.2;font-variant-numeric:tabular-nums}
.tile-l{font-size:13px;color:var(--ink)}.tile-s{font-size:12px;color:var(--mute)}
.cap{font-size:13px;color:var(--mute);margin-top:6px}

svg .axl{stroke:var(--axis);stroke-width:1}

.legend{display:flex;gap:14px;font-size:12px;color:var(--mute);margin-bottom:4px}
.sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.sw.s1{background:var(--s1)}.sw.s0{background:var(--s0)}
.hb-row{display:grid;grid-template-columns:5.2em 1fr 4.2em;align-items:center;gap:8px;padding:3px 0}
.hb-l{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.hb-v{font-size:13px;text-align:right;font-variant-numeric:tabular-nums;line-height:1.2}
.hb-d{font-size:11px;color:var(--mute)}
.rb-sec{font-size:13px;font-weight:700;color:var(--mute);margin:8px 0 4px;display:flex;justify-content:space-between;align-items:center;gap:8px}.rb-sec .legend{margin:0;font-weight:400}

.hm-c{color:var(--mute);text-align:center;white-space:nowrap;overflow:hidden}

.mm-leaf a{font-size:11px;color:var(--mute)}

.sm{display:grid;grid-template-columns:1fr 1fr;gap:8px}

.sm-h{display:flex;justify-content:space-between;font-size:13px;font-weight:600}
.sm-d{font-size:13px;font-weight:700}.sm-d.up{color:var(--red)}.sm-d.dn{color:var(--mute)}
.sm-v{font-size:28px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}.sm-v small{font-size:14px;color:var(--mute);margin-left:1px}

.ps-note{font-size:12px;color:var(--mute);background:var(--bg);border-radius:10px;padding:8px 10px;margin-bottom:8px;line-height:1.6}
.mk-wrap{margin-top:12px}.mk-cap{font-size:12px;color:var(--mute);margin-bottom:6px}
.mk-scroll{overflow:hidden;border-radius:6px;border:1px solid #c9d3df;position:relative;cursor:zoom-in}
.mk-scroll.big{overflow-x:auto;cursor:zoom-out;height:auto!important}.mk-scroll.big .mk{transform:none!important}

.mk-t{border-collapse:collapse;width:100%;background:#fff;margin-top:4px}

.cg{margin:10px 0 12px}.cg-h{font-size:15px;font-weight:800;margin-bottom:6px}.cg-h small{font-size:11px;color:var(--mute);font-weight:400;margin-left:6px}

<body>
<div class="wrap">
<header>
<h1>超级鹿鼎公微博汇总</h1>
<div class="sub">@挖地瓜的超级鹿鼎公 · 9月1日起 · 红色 = 重点 · 「问」是网友，「答」是他</div>
</header>
<nav class="tabs" id="tabs"></nav>
<main id="main"><div class="empty">加载中…</div></main>
<div class="foot">数据来自微博公开内容，每天自动更新。博主本人内容全文收录；转发的他人长文只节选，点「原文」看全文。</div>
</div>
<script>
const ORDER=["持仓与收益","黄金白银","电解铝","煤炭","铜","水电","火电","券商银行","利率与宏观","市场与大盘","方法论","其他个股","投资圈"];
const CHAT="闲聊";
const esc=s=>String(s??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
// allow only <b> tags from data
const rich=s=>esc(s).replace(/&lt;(\/?)b&gt;/g,"<$1b>");
const link=b=>`https://weibo.com/3962719063/${b}`;
let IDX=null, cache={}, cur=null;

async function getJSON(p){const r=await fetch(p,{cache:"no-cache"});if(!r.ok)throw new Error(p);return r.json();}

function tabs(){
  const el=document.getElementById("tabs");
  el.innerHTML=`<button data-v="charts">📊 图表</button><button data-v="day">📰 每日微博</button><button data-v="weeks">📅 每周要点</button><button data-v="mind">🧠 观点导图</button><button data-v="ps">🗂 持仓PS图</button><button data-v="track">📌 价位/仓位追踪</button>`;
  el.onclick=e=>{const v=e.target.closest("button")?.dataset.v;if(!v)return; if(v==="day")go(cur&&/^\d/.test(cur)?cur:IDX.days[0].date); else go(v);};
}
function mark(v){const k=/^\d/.test(v)?"day":v;document.querySelectorAll("#tabs button").forEach(b=>b.classList.toggle("on",b.dataset.v===k));}
function daybar(v){
  const i=IDX.days.findIndex(d=>d.date===v);
  const opts=IDX.days.map(d=>`<option value="${d.date}"${d.date===v?" selected":""}>${d.date.slice(5).replace("-","月")}日 ${d.weekday||""} · ${d.count}条（投资${d.inv??"?"}）</option>`).join("");
  return `<div class="daybar"><button data-step="1" ${i>=IDX.days.length-1?"disabled":""} aria-label="前一天">‹</button><select id="daysel">${opts}</select><button data-step="-1" ${i<=0?"disabled":""} aria-label="后一天">›</button></div>`;
}
function wireDaybar(v){
  const m=document.getElementById("main");
  m.querySelector("#daysel").onchange=e=>go(e.target.value);
  m.querySelectorAll(".daybar button").forEach(b=>b.onclick=()=>{const i=IDX.days.findIndex(d=>d.date===v)+Number(b.dataset.step);if(IDX.days[i])go(IDX.days[i].date);});
}
function weeksHTML(){
  return (IDX.weeks||[]).map(w=>`<section class="box wk"><h2>${esc(w.id.replace("2026-W","第")+"周")} <small>${esc(w.range)}</small></h2><ol class="hl">${w.items.map(x=>`<li>${rich(x)}</li>`).join("")}</ol></section>`).join("")||`<div class="empty">暂无</div>`;
}
function postHTML(p){
  const reply=!!p.q;
  return `<div class="post${reply?" reply":""}${p.buy?" buy":""}">
    <div class="meta"><span>${esc(p.t)}${p.buy?` <span class="buy-tag">🎯 想买/加仓</span>`:""}</span><a href="${link(p.b)}" target="_blank" rel="noopener">原文</a></div>
    ${reply?`<div class="q">${rich(p.q)}</div>`:""}
    <div class="x">${rich(p.x)}</div>
    ${p.src?`<div class="src"><em>${esc(p.src.u)}：</em>${rich(p.src.x)}</div>`:""}
    ${p.note?`<div class="note">${rich(p.note)}</div>`:""}
  </div>`;
}

function dayHTML(D){
  const groups={};
  D.posts.forEach(p=>{(groups[p.c||CHAT]=groups[p.c||CHAT]||[]).push(p)});
  const names=Object.keys(groups).sort((a,b)=>{
    const ia=a===CHAT?999:(ORDER.indexOf(a)<0?500:ORDER.indexOf(a));
    const ib=b===CHAT?999:(ORDER.indexOf(b)<0?500:ORDER.indexOf(b));return ia-ib;});
  const inv=D.posts.filter(p=>(p.c||CHAT)!==CHAT).length;
  const buys=D.posts.filter(p=>p.buy);
  let h=`<section class="box"><h2><span>今日要点${D.auto?`<span class="auto">自动摘选</span>`:""}</span> <small>${D.date} ${D.weekday||""} · 共${D.count}条，投资相关${inv}条</small></h2><ol class="hl">${D.highlights.map(x=>`<li>${rich(x)}</li>`).join("")}</ol>${D.auto?`<div class="auto">这一天是补录的，要点和分类为自动整理；人工细读的结论见「📅 每周要点」。</div>`:""}</section>`;
  if(buys.length)h=`<section class="box buybox"><h2>🎯 今天他说想买/想加仓的 <small>${buys.length}条</small></h2>${buys.map(postHTML).join("")}</section>`+h;
  names.forEach((n,i)=>{
    const isChat=n===CHAT;
    h+=`<details class="grp${isChat?"":" inv"}"${isChat?"":" open"}><summary><span>${esc(n)}<span class="n">${groups[n].length}条</span></span></summary>${groups[n].map(postHTML).join("")}</details>`;
  });
  return h;
}

function trackHTML(){
  const assets=[...new Set(IDX.tracker.map(r=>r.a))];
  const sel=window.__asset||"全部";
  let rows=IDX.tracker.filter(r=>sel==="全部"||r.a===sel).sort((a,b)=>a.a===b.a?b.d.localeCompare(a.d):assets.indexOf(a.a)-assets.indexOf(b.a));
  const rb=(IDX.charts&&IDX.charts.rebal)?`<section class="box viz-root"><h2>10月仓位推算 <small>${IDX.charts.rebal.from} 持仓截图 → ${IDX.charts.rebal.to} 月度总结（估算）</small></h2><div id="rebal"></div></section>`:"";
  return `<div id="lvl"></div>`+(window.renderWatch?window.renderWatch(IDX):"")+rb+`<section class="box"><h2>价位 / 仓位追踪 <small>跨天累积，按标的分组，新的在上</small></h2>
  <div class="chips">${["全部",...assets].map(a=>`<button data-a="${esc(a)}" class="${a===sel?"on":""}">${esc(a)}</button>`).join("")}</div>
  <table>${rows.map((r,i)=>`<tr><td class="a">${i>0&&rows[i-1].a===r.a?"":esc(r.a)}</td><td class="d">${r.d.slice(5)}</td><td>${rich(r.x)}<a href="${link(r.b)}" target="_blank" rel="noopener">原文</a></td></tr>`).join("")}</table></section>`;
}

async function go(v){
  cur=v; mark(v);
  const m=document.getElementById("main");
  const h=["track","weeks","charts","mind","ps"].includes(v)?v:"d"+v.replace(/-/g,"");
  try{ if(location.hash!=="#"+h) history.replaceState(null,"","#"+h); }catch(e){}
  if(v==="track"){m.innerHTML=trackHTML();if(window.renderLevels)window.renderLevels(m.querySelector("#lvl"),IDX);if(IDX.charts&&IDX.charts.rebal&&window.renderRebal)window.renderRebal(m.querySelector("#rebal"),IDX.charts.rebal);m.querySelector(".chips").onclick=e=>{const a=e.target.dataset.a;if(a){window.__asset=a;go("track");}};return;}
  if(v==="weeks"){m.innerHTML=weeksHTML();return;}
  if(v==="charts"){window.renderCharts(m,IDX,getJSON,cache);return;}
  if(v==="mind"){m.innerHTML=window.renderMindmap(IDX);return;}
  if(v==="ps"){window.renderPS(m,getJSON);return;}
  m.innerHTML=daybar(v)+`<div class="empty">加载中…</div>`; wireDaybar(v);
  try{ cache[v]=cache[v]||await getJSON(`data/${v}.json`); if(cur===v){ const mode=window.__dayMode||"ig"; m.innerHTML=daybar(v)+`<div class="modesw"><button data-mode="ig" class="${mode==="ig"?"on":""}">🖼 信息图</button><button data-mode="text" class="${mode==="text"?"on":""}">📝 文字版</button></div>`+(mode==="ig"?window.renderInfographic(cache[v]):dayHTML(cache[v])); wireDaybar(v); m.querySelectorAll(".modesw button").forEach(b=>b.onclick=()=>{window.__dayMode=b.dataset.mode;go(v);});} }
  catch(e){ m.innerHTML=daybar(v)+`<div class="empty">这一天的数据读取失败，请稍后刷新</div>`; wireDaybar(v); }
}

(async()=>{
  try{ IDX=await getJSON("data/index.json"); }catch(e){document.getElementById("main").innerHTML=`<div class="empty">数据读取失败，请刷新</div>`;return;}
  IDX.days.sort((a,b)=>b.date.localeCompare(a.date));
  tabs();
  const h=location.hash.slice(1);
  window.__goDay=d=>go(d);
  let start="charts";
  if(["track","weeks","charts","mind","ps"].includes(h))start=h;
  else if(/^d\d{8}$/.test(h)){const d=h.slice(1,5)+"-"+h.slice(5,7)+"-"+h.slice(7);if(IDX.days.some(x=>x.date===d))start=d;}
  go(start);
})();
</script>
<script src="charts.js"></script>
<script src="visual.js"></script>
<script src="ps.js"></script>
<script src="levels.js"></script>
<script src="talk.js"></script>
