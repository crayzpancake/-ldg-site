</div>
<script>
const ORDER=["持仓与收益","黄金白银","电解铝","煤炭","铜","水电","火电","券商银行","利率与宏观","市场与大盘","方法论","其他个股","投资圈"];
const CHAT="闲聊";
const esc=s=>String(s??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
// allow only <b> tags from data
const rich=s=>esc(s).replace(/&lt;(\/?)b&gt;/g,"<$1b>");
const link=(b,src)=>src==="xq"?`https://xueqiu.com/8790885129/${b}`:`https://weibo.com/3962719063/${b}`;
let IDX=null, cache={}, cur=null;

async function getJSON(p){const r=await fetch(p,{cache:"no-cache"});if(!r.ok)throw new Error(p);return r.json();}

function tabs(){
  const el=document.getElementById("tabs");
  el.innerHTML=`<button data-v="home">🏠 今日</button><button data-v="charts">📊 图表</button><button data-v="day">📰 每日微博</button><button data-v="weeks">📅 每周要点</button><button data-v="mind">🧠 观点导图</button><button data-v="ps">🗂 持仓PS图</button><button data-v="method">📚 方法论</button><button data-v="track">📌 价位/仓位追踪</button><button data-v="ops">📝 操作日志</button><button data-v="stock">🔎 按股票看</button><button data-v="month">🗓 月度总结</button>`;
  el.onclick=e=>{const v=e.target.closest("button")?.dataset.v;if(!v)return; if(v==="day")go(cur&&/^\d/.test(cur)?cur:IDX.days[0].date); else go(v);};
}
function mark(v){const k=v==="home"?"home":(/^\d/.test(v)?"day":v);document.querySelectorAll("#tabs button").forEach(b=>{const on=b.dataset.v===k;b.classList.toggle("on",on);if(on){const row=b.parentElement;if(row)row.scrollTo({left:b.offsetLeft-(row.clientWidth-b.clientWidth)/2,behavior:"smooth"});}});const bn=v==="home"||/^\d/.test(v)?"home":(["charts","track"].includes(v)?v:(["weeks","mind","ps","method","ops","stock","month"].includes(v)?"more":""));document.querySelectorAll("#bottomNav button").forEach(b=>b.classList.toggle("on",b.dataset.bn===bn));}
function daybar(v){
  const i=IDX.days.findIndex(d=>d.date===v);
  const opts=IDX.days.map(d=>`<option value="${d.date}"${d.date===v?" selected":""}>${d.date.slice(5).replace("-","月")}日 ${d.weekday||""} · ${d.count}条${d.live?"（今天·实时更新中）":""}</option>`).join("");
  return `<div class="daybar"><button data-step="1" ${i>=IDX.days.length-1?"disabled":""} aria-label="前一天">‹</button><select id="daysel">${opts}</select><button data-step="-1" ${i<=0?"disabled":""} aria-label="后一天">›</button>${IDX.days[i]&&!IDX.days[i].live?`<button class="shr" onclick="window.shareDay('${v}')">🔗 分享</button>`:""}</div>`;
}
function wireDaybar(v){
  const m=document.getElementById("main");
  m.querySelector("#daysel").onchange=e=>go(e.target.value);
  m.querySelectorAll(".daybar button").forEach(b=>b.onclick=()=>{const i=IDX.days.findIndex(d=>d.date===v)+Number(b.dataset.step);if(IDX.days[i])go(IDX.days[i].date);});
}
function weeksHTML(){
  return (IDX.weeks||[]).map(w=>`<section class="box wk"><h2>${esc(w.id.replace("2026-W","第")+"周")} <small>${esc(w.range)}</small></h2><ol class="hl">${w.items.map(x=>`<li>${rich(x)}</li>`).join("")}</ol></section>`).join("")||`<div class="empty">暂无</div>`;
}
function postHTML(p,date){
  const reply=!!p.q;
  const txt=String(p.x||"").replace(/<[^>]+>/g,"");
  const key=!!p.buy||/<b>/.test(p.x||"")||/(加仓|买入|建仓|减仓|卖出|止盈|清仓|满仓|仓位|价位|防线|关口)/.test(txt);
  const long=txt.length>180;
  return `<div class="post${reply?" reply":""}${p.buy?" buy":""}${key?" key":""}${long?" long":""}" data-post="${esc(p.b||"")}">
    <div class="meta"><span>${esc(p.t)}${p.s==="xq"?` <span class="buy-tag" style="background:#2f6fd6">雪球</span>`:""}${p.buy?` <span class="buy-tag">🎯 想买/加仓</span>`:""}</span><span class="post-actions"><a href="${link(p.b,p.s)}" target="_blank" rel="noopener">原文</a>${date?`<button type="button" onclick="window.copyPostLink('${date}','${esc(p.b||"")}',this)">复制单条链接</button>`:""}</span></div>
    ${reply?`<div class="q">${rich(p.q)}</div>`:""}
    <div class="x">${rich(p.x)}</div>${long?`<button type="button" class="post-more">展开全文</button>`:""}
    ${p.src?`<div class="src"><em>${esc(p.src.u)}：</em>${rich(p.src.x)}</div>`:""}
    ${p.note?`<div class="note">${rich(p.note)}</div>`:""}
  </div>`;
}
window.copyPostLink=async function(date,b,btn){
  const url=`${location.origin}/#d${date.replace(/-/g,"")}@${encodeURIComponent(b)}`;
  try{await navigator.clipboard.writeText(url);if(btn){const o=btn.textContent;btn.textContent="已复制";setTimeout(()=>btn.textContent=o,1600);}}
  catch(e){prompt("复制这个链接",url);}
};

function dayHTML(D){
  const groups={};
  D.posts.forEach(p=>{(groups[p.c||CHAT]=groups[p.c||CHAT]||[]).push(p)});
  const names=Object.keys(groups).sort((a,b)=>{
    const ia=a===CHAT?999:(ORDER.indexOf(a)<0?500:ORDER.indexOf(a));
    const ib=b===CHAT?999:(ORDER.indexOf(b)<0?500:ORDER.indexOf(b));return ia-ib;});
  const inv=D.posts.filter(p=>(p.c||CHAT)!==CHAT).length;
  const buys=D.posts.filter(p=>p.buy);
  let h=`<section class="box"><h2><span>今日要点${D.auto?`<span class="auto">自动摘选</span>`:""}</span> <small>${D.date} ${D.weekday||""} · 共${D.count}条，投资相关${inv}条</small></h2><ol class="hl">${D.highlights.map(x=>`<li>${rich(x)}</li>`).join("")}</ol>${D.auto?`<div class="auto">这一天是补录的，要点和分类为自动整理；人工细读的结论见「📅 每周要点」。</div>`:""}</section>`;
  if(buys.length)h=`<section class="box buybox"><h2>🎯 今天他说想买/想加仓的 <small>${buys.length}条</small></h2>${buys.map(p=>postHTML(p,D.date)).join("")}</section>`+h;
  names.forEach((n,i)=>{
    const isChat=n===CHAT;
    h+=`<details class="grp${isChat?"":" inv"}"${isChat?"":" open"}><summary><span>${esc(n)}<span class="n">${groups[n].length}条</span></span></summary>${groups[n].map(p=>postHTML(p,D.date)).join("")}</details>`;
  });
  return h;
}

function trackHTML(){
  const assets=[...new Set(IDX.tracker.map(r=>r.a))];
  const sel=window.__asset||"全部";
  let rows=IDX.tracker.filter(r=>sel==="全部"||r.a===sel).sort((a,b)=>a.a===b.a?b.d.localeCompare(a.d):assets.indexOf(a.a)-assets.indexOf(b.a));
  const rb=(IDX.charts&&IDX.charts.rebal)?`<section class="box viz-root" id="trk-rebal"><h2>10月仓位推算 <small>${IDX.charts.rebal.from} 持仓截图 → ${IDX.charts.rebal.to} 月度总结（估算）</small></h2><div id="rebal"></div></section>`:"";
  return `<div class="trk-nav"><button data-to="lvl">📌 他提过的价位</button><button data-to="trk-watch">🎯 想买/想加仓</button>${IDX.charts&&IDX.charts.rebal?`<button data-to="trk-rebal">🧮 仓位推算</button>`:""}<button data-to="trk-table">📋 追踪表</button></div><div id="lvl"></div>`+`<div id="trk-watch">`+(window.renderWatch?window.renderWatch(IDX):"")+`</div>`+rb+`<section class="box" id="trk-table"><h2>价位 / 仓位追踪 <small>跨天累积，按标的分组，新的在上</small></h2>
  <div class="chips">${["全部",...assets].map(a=>`<button data-a="${esc(a)}" class="${a===sel?"on":""}">${esc(a)}</button>`).join("")}</div>
  <table>${rows.map((r,i)=>`<tr><td class="a">${i>0&&rows[i-1].a===r.a?"":esc(r.a)}</td><td class="d">${r.d.slice(5)}</td><td>${rich(r.x)}<a href="${link(r.b)}" target="_blank" rel="noopener">原文</a></td></tr>`).join("")}</table></section>`;
}

async function go(v){
  cur=v; mark(v); if(window.hit)window.hit(/^\d/.test(v)?"day":v);
  const m=document.getElementById("main"); m.classList.remove("key-only");
  if(v==="home"){ try{ if(location.hash!=="#home") history.replaceState(null,"","#home"); }catch(e){} const d=IDX.days[0]; if(!d){m.innerHTML=`<div class="empty">暂无数据</div>`;return;} m.innerHTML=`<div class="empty">正在整理今日一页纸…</div>`; try{ cache[d.date]=cache[d.date]||await getJSON(`data/${d.date}.json`); if(cur!=="home")return; m.innerHTML=window.renderTodayPaper(cache[d.date],IDX); if(window.refreshTodayPaper)window.refreshTodayPaper(); }catch(e){ if(cur==="home")m.innerHTML=`<div class="empty">今日数据读取失败，请稍后刷新</div>`; } return; }
  const h=v==="home"?"home":(["track","weeks","charts","mind","ps","method","ops","month"].includes(v)?v:"d"+v.replace(/-/g,""));
  if(v!=="stock"){try{ if(location.hash!=="#"+h) history.replaceState(null,"","#"+h); }catch(e){}}
  if(v==="ops"){window.renderOps(m,IDX);return;}
  if(v==="month"){window.renderMonthly(m,IDX);return;}
  if(v==="stock"){window.renderStock(m,IDX,window.__stockStart);window.__stockStart=null;return;}
  if(v==="track"){m.innerHTML=trackHTML();if(window.renderLevels)window.renderLevels(m.querySelector("#lvl"),IDX);if(window.refreshWatch)window.refreshWatch(IDX);if(window.loadWatchSparks)window.loadWatchSparks();if(IDX.charts&&IDX.charts.rebal&&window.renderRebal)window.renderRebal(m.querySelector("#rebal"),IDX.charts.rebal);m.querySelector(".chips").onclick=e=>{const a=e.target.dataset.a;if(a){window.__asset=a;go("track");}};const tn=m.querySelector(".trk-nav");if(tn)tn.onclick=e=>{const id=e.target.dataset&&e.target.dataset.to;const el=id&&document.getElementById(id);if(el)el.scrollIntoView({behavior:"smooth",block:"start"});};return;}
  if(v==="weeks"){m.innerHTML=weeksHTML();return;}
  if(v==="charts"){Promise.resolve(window.renderCharts(m,IDX,getJSON,cache)).then(()=>{if(cur==="charts"&&window.renderQuick)window.renderQuick(m,IDX);if(cur==="charts"&&window.renderBoard)window.renderBoard(m,IDX,cache);if(cur==="charts"&&window.renderCopper)window.renderCopper(m,IDX,cache);});return;}
  if(v==="mind"){m.innerHTML=window.renderMindmap(IDX);return;}
  if(v==="ps"){window.renderPS(m,getJSON);return;}
  if(v==="method"){window.renderMethod();return;}
  m.innerHTML=daybar(v)+`<div class="empty">加载中…</div>`; wireDaybar(v);
  try{ cache[v]=cache[v]||await getJSON(`data/${v}.json`); if(cur===v){ const mode=window.__dayMode||"ig"; m.innerHTML=daybar(v)+(cache[v].live?`<div class="ps-why">⏱ 今天的微博实时更新中（约每小时一次），最近更新 ${cache[v].updated?new Date(cache[v].updated).toLocaleTimeString("zh-CN",{hour:"2-digit",minute:"2-digit",timeZone:"Asia/Shanghai"}):""}；第二天早上会整理成完整版。</div>`:"")+`<div class="modesw"><button data-mode="ig" class="${mode==="ig"?"on":""}">🖼 信息图</button><button data-mode="text" class="${mode==="text"?"on":""}">📝 文字版</button></div>`+(mode==="ig"?window.renderInfographic(cache[v]):dayHTML(cache[v])); wireDaybar(v); m.querySelectorAll(".modesw button").forEach(b=>b.onclick=()=>{window.__dayMode=b.dataset.mode;go(v);});
  if(mode==="text"){ const keyN=cache[v].posts.filter(p=>p.buy||/<b>/.test(p.x||"")||/(加仓|买入|建仓|减仓|卖出|止盈|清仓|满仓|仓位|价位|防线|关口)/.test(String(p.x||"").replace(/<[^>]+>/g,""))).length; const rb=document.createElement("div"); rb.className="readbar"; rb.innerHTML=`<button type="button" class="${window.__keyOnly?"on":""}">${window.__keyOnly?"⭐ 正在只看重点":"⭐ 只看重点"}</button><span class="cnt">重点 ${keyN} / 共 ${cache[v].posts.length} 条</span>`; const ms=m.querySelector(".modesw"); if(ms)ms.after(rb); if(window.__keyOnly)m.classList.add("key-only"); rb.querySelector("button").onclick=()=>{window.__keyOnly=!window.__keyOnly;go(v);}; }
  m.querySelectorAll(".post-more").forEach(b=>b.onclick=()=>{const p=b.closest(".post");p.classList.toggle("open");b.textContent=p.classList.contains("open")?"收起":"展开全文";});
  if(window.__postFocus){ const el=m.querySelector(`[data-post="${window.__postFocus}"]`); if(el){ const det=el.closest("details"); if(det)det.open=true; setTimeout(()=>{el.scrollIntoView({behavior:"smooth",block:"center"});el.classList.add("post-focus");},80); } window.__postFocus=null; } } }
  catch(e){ m.innerHTML=daybar(v)+`<div class="empty">这一天的数据读取失败，请稍后刷新</div>`; wireDaybar(v); }
}

(async()=>{
  try{ IDX=await getJSON("data/index.json"); }catch(e){document.getElementById("main").innerHTML=`<div class="empty">数据读取失败，请刷新</div>`;return;}
  IDX.days.sort((a,b)=>b.date.localeCompare(a.date));
  try{const T=await fetch("/api/today",{cache:"no-store"}).then(r=>r.json());
    if(T&&T.date&&T.posts&&T.posts.length&&(!IDX.days[0]||T.date>IDX.days[0].date)){T.live=true;cache[T.date]=T;IDX.days.unshift({date:T.date,weekday:T.weekday||"",count:T.posts.length,inv:T.posts.length,live:true});}}catch(e){}
  window.__IDX=IDX;window.__cache=cache;window.__getJSON=getJSON;
  tabs();
  window.__go=go;
  if(window.renderUpdated)window.renderUpdated(IDX);
  if(window.renderGuide)window.renderGuide();
  if(window.renderQuote)window.renderQuote(IDX);
  const h=location.hash.slice(1);
  window.__goDay=d=>go(d);
  let start="home";
  if(["home","track","weeks","charts","mind","ps","method","ops","month","stock"].includes(h))start=h;
  if(/^stock=/.test(h)){window.__stockStart=decodeURIComponent(h.slice(6));start="stock";}
  if(h==="news"&&window.renderNews){window.renderNews();return;}
  if(h==="gloss"&&window.renderGloss){window.renderGloss();return;}
  if(h==="app"&&window.renderApp){window.renderApp();return;}
  else if(/^d\d{8}$/.test(h)){const d=h.slice(1,5)+"-"+h.slice(5,7)+"-"+h.slice(7);if(IDX.days.some(x=>x.date===d))start=d;}
  else if(/^d\d{8}@/.test(h)){const d=h.slice(1,5)+"-"+h.slice(5,7)+"-"+h.slice(7);if(IDX.days.some(x=>x.date===d)){start=d;window.__postFocus=decodeURIComponent(h.slice(10));window.__dayMode="text";}}
  if(/^s=/.test(h)&&window.doSearch){window.doSearch(decodeURIComponent(h.slice(2)));return;}
  go(start);
})();
</script>
