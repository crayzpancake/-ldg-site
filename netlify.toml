[build]
  publish = "."
  command = ""

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# 静态缓存：PS 图发出去永不变，长缓存；JS 短缓存 1 小时（内容数据与页面本身不缓存）
[[headers]]
  for = "/ps/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/icon.png"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/icon-192.png"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/icon-512.png"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/og.png"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/charts.js"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/visual.js"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/ps.js"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/extra.js"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/board.js"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/levels.js"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/talk.js"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/more.js"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/data/search-index.json"
  [headers.values]
    Cache-Control = "public, max-age=3600"
